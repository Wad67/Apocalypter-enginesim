# Engine Sim engines (format 6).
# Everything engine-sim builds each engine from, one section per engine part. The game keeps an engine's
# power, idle, rev limit and inertia as data (those are read from the vehicle); everything else is here.
# Sections are the part prefab's Easy Save id (ES3Prefab.prefabId); the text after '#' is only a label.
# Parts not listed keep the game's own engine sound; their ids are written to LogOutput.log.
# A section needs only the five basic keys: any key left out gets a generic value worked out from them.
# Delete this file to get the shipped values back. Changes apply to the next engine that starts.
#
#   cylinders               1 - 16
#   layout                  I (inline), V or B (boxer)
#   bank_angle              degrees between the banks of a V; 0 for inline and boxer
#   displacement            litres; only used to work out the defaults of keys left out (bore and stroke set the real size)
#   fuel                    gasoline or diesel
#   firing_angles           crank degrees within the 720 degree cycle at which each cylinder fires (cylinder 1 first)
#   cylinder_banks          bank of each cylinder: 0 (left) or 1 (right); all 0 for inline
#   bore                    mm
#   stroke                  mm
#   rod_length              mm
#   compression_height      mm, wrist pin to piston crown
#   compression_ratio       : 1
#   piston_mass             g
#   rod_mass                g
#   crank_mass              kg
#   flywheel_mass           kg
#   flywheel_radius         mm
#   friction_torque         Nm
#   starter_torque          Nm
#   starter_speed           rpm
#   blowby                  cfm at 28 inH2O past the rings of a new engine (wear adds to it)
#   plenum_volume           L
#   plenum_area             cm2
#   intake_flow             cfm, throttle body / carburettor wide open
#   runner_flow             cfm, plenum to each intake runner
#   runner_length           mm
#   idle_throttle_plate     closed throttle plate position, 0 - 1 (lower = more idle air)
#   throttle_gamma          throttle pedal to plate curve
#   intake_velocity_decay   0 - 1
#   intake_port_flow        cfm at 28 inH2O at 0, 50, 100 ... 700 thou of valve lift (15 values)
#   exhaust_port_flow       the same for the exhaust ports
#   head_flow_scale         port flow factor per bank (bank 0, bank 1)
#   intake_runner_volume    cc, in the head
#   intake_runner_area      cm2
#   exhaust_runner_volume   cc, in the head
#   exhaust_runner_area     cm2
#   intake_cam_duration     crank degrees at 0.050" lift
#   intake_cam_lift         mm
#   intake_cam_gamma        lobe shape: below 1 fuller, above 1 more pointed
#   intake_lobe_center      degrees after TDC
#   exhaust_cam_duration    crank degrees at 0.050" lift
#   exhaust_cam_lift        mm
#   exhaust_cam_gamma       lobe shape
#   exhaust_lobe_center     degrees before TDC
#   cam_base_radius         mm
#   collector_diameter      mm, one collector per bank
#   outlet_flow             cfm out of the collector (times the exhaust part's flow)
#   primary_length          mm, header tubes (times the exhaust part's header length)
#   primary_flow            cfm through the header tubes
#   exhaust_velocity_decay  0 - 1
#   exhaust_volume          loudness of each bank's exhaust (bank 0, bank 1)
#   header_lengths          mm, each cylinder's sound path to the collector (cylinder 1 first)
#   sound_attenuation       each cylinder's share of the sound (cylinder 1 first)
#   timing                  ignition advance: rpm:degrees pairs, 1 - 12
#   burning_efficiency      0 - 1
#   simulation_frequency    physics steps per second (small cylinders need more)
#   min_gas_steps           gas dynamics steps per second the cylinder size needs to stay stable; raises SimQuality when needed
#   air_noise               synthesizer air noise 0 - 1; 0 = chosen to suit the impulse response
#   jitter                  synthesizer pulse jitter 0 - 1; 0 = chosen to suit the impulse response
#   drive_torque_scale      [Experimental] simulated drivetrain only: the engine's torque times this, matching the
#                           game's rated power (the game's power / the simulated engine's, at full condition)
#   peak_torque             [Experimental] simulated drivetrain only: the engine's peak torque at 1 atm, N m; sizes
#                           the clutch (2.5 x this x drive_torque_scale), which the game sizes from its power figure

